<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select CV Language</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: min(90%, 420px);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .button.secondary {
            background: #374151;
        }

        .button.secondary:hover {
            background: #1f2937;
        }

        .flag {
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Adam El Zahiri Curriculum Vitae</h1>
    <p>Please select your preferred language.<br>Kies je voorkeurstaal.</p>

    <div class="buttons">
        <a class="button" href="cv-en.html">
            <span class="flag">🇬🇧</span> English
        </a>

        <a class="button secondary" href="cv-nl.html">
            <span class="flag">🇳🇱</span> Nederlands
        </a>
    </div>
</div>

</body>
</html>
